<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>교역품 시세 조회</title>
<style>
  :root {
    --bg: #16181c;
    --card: #1e2126;
    --border: #2d3138;
    --border-strong: #3d434c;
    --text: #e8e6e1;
    --text-muted: #8b929c;
    --accent: #d99a5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  input[type="text"], input[type="number"], select {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
  }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { background: #2a2e34; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-row select, .filter-row input { min-width: 140px; }

  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); overflow: hidden; }
  .item-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; cursor: pointer; gap: 10px; flex-wrap: wrap;
  }
  .item-head:hover { background: #25282e; }
  .item-title { font-size: 14px; font-weight: 700; }
  .item-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
  .tag.source-물물교환 { background: #22374a; color: #7ab3e0; }
  .tag.source-명산품 { background: #442a26; color: #e08a70; }
  .tag.category { background: #ece6d8; color: var(--text-muted); }
  .tag.origin { background: #23392a; color: #7ec996; }
  .item-best { font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .item-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .item-body.open { display: block; }

  .sales-table-wrap { max-height: 320px; overflow-y: auto; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); border-radius: 6px; }
  table.sales-table { width: 100%; border-collapse: collapse; margin: 0; font-size: 13px; }
  table.sales-table th, table.sales-table td { text-align: center; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.sales-table th { color: var(--text-muted); font-weight: 700; font-size: 11px; position: sticky; top: 0; background: var(--card); z-index: 1; }
  table.sales-table tr.best-row { background: #3a2f1f; }
  table.sales-table td.num { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }

  .calc-box { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); }
  .calc-box label { font-size: 11px; color: var(--text-muted); display: block; }

  .empty-hint { font-size: 12px; color: var(--text-muted); padding: 12px 0; text-align: center; }
  .hint { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }

  .main-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .main-tab-btn {
    font-family: inherit; font-size: 14px; padding: 10px 18px; border: none; background: none;
    color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .main-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .main-tab-btn:hover { color: var(--text); }

  .hype-row {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .hype-row.past { opacity: 0.45; }
  .hype-row.now { background: #3a2f1f; border-radius: 6px; }
  .hype-time { width: 90px; flex-shrink: 0; font-variant-numeric: tabular-nums; color: var(--text-muted); font-weight: 700; }
  .hype-region { width: 130px; flex-shrink: 0; font-weight: 700; }
  .hype-kind { width: 70px; flex-shrink: 0; font-weight: 700; }
  .hype-countdown { font-size: 12px; color: var(--accent); font-weight: 700; }

  .boost-card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 12px 14px; margin-bottom: 10px; }
  .boost-card-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; }
  .boost-card-time { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; font-weight: 700; }
  .boost-card-region { font-weight: 700; font-size: 14px; }
  .boost-card-kind { font-size: 12px; background: #2d3138; color: var(--accent); border-radius: 4px; padding: 2px 8px; font-weight: 700; }
  .boost-items { display: flex; flex-wrap: wrap; gap: 6px; }
  .boost-item-chip { font-size: 12px; background: #23392a; color: #7ec996; border-radius: 5px; padding: 3px 9px; white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>

<h1>대항오 정보 조회</h1>
<p class="sub">교역품 시세와 대유행 일정을 조회합니다. (조회 전용 — 데이터 등록/수정은 관리자 페이지에서 합니다)</p>

<div class="main-tabs">
  <button class="main-tab-btn active" id="tabBtnPrice">판매가격</button>
  <button class="main-tab-btn" id="tabBtnSchedule">일정</button>
</div>

<div id="tabPanelPrice">
<div class="toolbar">
  <button id="refreshBtn">새로고침</button>
  <span id="remoteStatus" style="font-size:12px;"></span>
</div>

<div class="filter-row">
  <input type="text" id="searchInput" placeholder="이름 검색">
  <select id="filterSource">
    <option value="">구분 전체</option>
    <option value="물물교환">물물교환</option>
    <option value="명산품">명산품</option>
  </select>
  <select id="filterCategory"><option value="">분류 전체</option></select>
  <select id="filterOrigin"><option value="">획득처 전체</option></select>
</div>

<div class="item-list" id="itemList"></div>
</div>

<div id="tabPanelSchedule" style="display:none;">
  <h2 style="font-size:15px; margin:0 0 6px;">대유행</h2>
  <p class="hint">기준 시각으로부터 지난 2시간 ~ 앞으로 22시간(총 24시간) 동안의 대유행 일정입니다. 실측으로 확인된 종류별 고정 주기를 기반으로 계산합니다 (지난 데이터로 검증 완료, 예외 없음).</p>
  <div id="hypeNowLabel" style="font-size:13px; color:var(--text-muted); margin-bottom:10px;"></div>
  <div id="hypeList"></div>

  <h2 style="font-size:15px; margin:28px 0 6px; padding-top:16px; border-top:1px solid var(--border);">부양</h2>
  <p class="hint">관리자가 등록한 부양 일정과 추천 판매 품목입니다. (조회 전용)</p>
  <div id="boostList"></div>
</div>

개발": "2026-09-15T22:00:00", "사치": "2026-09-17T01:00:00"}, "남아메리카": {"전염병": "2026-09-04T23:00:00", "개발": "2026-09-04T16:00:00", "후원": "2026-09-09T08:00:00", "홍수": "2026-09-10T21:00:00", "축제": "2026-09-10T23:00:00", "전쟁": "2026-09-12T00:00:00", "사치": "2026-09-14T07:00:00", "호황": "2026-09-14T16:00:00"}, "동아시아": {"전쟁": "2026-09-08T19:00:00", "축제": "2026-09-09T11:00:00", "사치": "2026-09-09T17:00:00", "홍수": "2026-09-10T23:00:00", "개발": "2026-09-11T20:00:00", "전염병": "2026-09-12T15:00:00", "호황": "2026-09-15T09:00:00", "후원": "2026-09-15T11:00:00"}}};

// ── 대유행 타이머 ──────────────────────────────────
function formatKST(date) {
  const mm = String(date.getMonth()+1).padStart(2,'0');
  const dd = String(date.getDate()).padStart(2,'0');
  const hh = String(date.getHours()).padStart(2,'0');
  const mi = String(date.getMinutes()).padStart(2,'0');
  return mm + '/' + dd + ' ' + hh + ':' + mi;
}
function formatCountdown(diffMs) {
  const abs = Math.abs(diffMs);
  const totalMin = Math.floor(abs / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  const label = h > 0 ? h + '시간 ' + m + '분' : m + '분';
  return diffMs >= 0 ? label + ' 후' : label + ' 전';
}

function computeHypeWindow(now, pastHours, futureHours) {
  const windowStart = new Date(now.getTime() - pastHours * 3600000);
  const windowEnd = new Date(now.getTime() + futureHours * 3600000);
  const results = [];
  Object.entries(HYPE_DATA.anchors).forEach(([region, kinds]) => {
    Object.entries(kinds).forEach(([kind, anchorStr]) => {
      const period = HYPE_DATA.periods[kind];
      const anchor = new Date(anchorStr);
      const periodMs = period * 3600000;
      // windowStart 근처의 첫 발생부터 windowEnd까지 반복
      let k = Math.floor((windowStart.getTime() - anchor.getTime()) / periodMs) - 1;
      let occurrence = new Date(anchor.getTime() + k * periodMs);
      while (occurrence.getTime() <= windowEnd.getTime()) {
        if (occurrence.getTime() >= windowStart.getTime()) {
          results.push({ region, kind, time: occurrence });
        }
        k += 1;
        occurrence = new Date(anchor.getTime() + k * periodMs);
      }
    });
  });
  results.sort((a, b) => a.time - b.time);
  return results;
}

function renderHypeTab() {
  const now = new Date();
  document.getElementById('hypeNowLabel').textContent = '기준 시각: ' + formatKST(now) + ' (지금부터 -2h ~ +22h 표시)';
  const events = computeHypeWindow(now, 2, 22);
  const container = document.getElementById('hypeList');
  container.innerHTML = '';
  if (events.length === 0) {
    container.innerHTML = "<div class='empty-hint'>이 구간에 예정된 대유행이 없습니다.</div>";
    return;
  }
  events.forEach(ev => {
    const diffMs = ev.time - now;
    const isPast = diffMs < 0;
    const isNow = Math.abs(diffMs) < 3600000 * 1; // 앞뒤 1시간 이내면 강조
    const row = document.createElement('div');
    row.className = 'hype-row' + (isPast ? ' past' : '') + (isNow ? ' now' : '');
    row.innerHTML =
      "<span class='hype-time'>" + formatKST(ev.time) + "</span>" +
      "<span class='hype-region'>" + ev.region + "</span>" +
      "<span class='hype-kind'>" + ev.kind + "</span>" +
      "<span class='hype-countdown'>" + formatCountdown(diffMs) + "</span>";
    container.appendChild(row);
  });
}

document.getElementById('tabBtnPrice').addEventListener('click', () => {
  document.getElementById('tabBtnPrice').classList.add('active');
  document.getElementById('tabBtnSchedule').classList.remove('active');
  document.getElementById('tabPanelPrice').style.display = '';
  document.getElementById('tabPanelSchedule').style.display = 'none';
});
document.getElementById('tabBtnSchedule').addEventListener('click', () => {
  document.getElementById('tabBtnSchedule').classList.add('active');
  document.getElementById('tabBtnPrice').classList.remove('active');
  document.getElementById('tabPanelPrice').style.display = 'none';
  document.getElementById('tabPanelSchedule').style.display = '';
  renderHypeTab();
  renderBoostList();
});
setInterval(() => {
  if (document.getElementById('tabPanelSchedule').style.display !== 'none') renderHypeTab();
}, 60000);

function renderBoostList() {
  const container = document.getElementById('boostList');
  container.innerHTML = '';
  const sorted = boosts.slice().sort((a, b) => new Date(b.time) - new Date(a.time));
  if (sorted.length === 0) {
    container.innerHTML = "<div class='empty-hint'>등록된 부양 일정이 없습니다.</div>";
    return;
  }
  sorted.forEach(b => {
    const card = document.createElement('div');
    card.className = 'boost-card';
    const time = new Date(b.time);
    const timeStr = (time.getMonth()+1) + '/' + time.getDate() + ' ' + String(time.getHours()).padStart(2,'0') + ':' + String(time.getMinutes()).padStart(2,'0');
    const itemsHtml = (b.items || []).map(it =>
      "<span class='boost-item-chip'>" + it.name + (it.priceRange ? ' ' + it.priceRange : '') + "</span>"
    ).join('');
    card.innerHTML =
      "<div class='boost-card-head'>" +
        "<span class='boost-card-time'>" + timeStr + "</span>" +
        "<span class='boost-card-region'>" + b.region + "</span>" +

// ── 도시 → 문화권/지역/우대율 자동 조회 ──────────────
// 도시 자동완성용 전역 datalist를 body에 한 번만 주입
(function () {
  const dl = document.createElement("datalist");
  dl.id = "allCitiesOptions";
  dl.innerHTML = UWO_DATA.ALL_CITIES.map(c => "<option value='" + c + "'></option>").join("");
  document.body.appendChild(dl);
})();

function normalizeItemName(name) {
  return UWO_DATA.ITEM_NAME_ALIASES[name] || name;
}
function getCulture(city) {
  return UWO_DATA.CITY_TO_CULTURE[city] || null;
}
function getRegion(city) {
  return UWO_DATA.CITY_TO_REGION[city] || null;
}
function getRegionBonus(city, category, itemName) {
  const culture = getCulture(city);
  if (!culture) return 0;
  const cultureData = UWO_DATA.CULTURES[culture];
  if (!cultureData) return 0;
  const normName = normalizeItemName(itemName);
  const cieKey = city + "||" + normName;
  if (cultureData.cityItemExceptions && cultureData.cityItemExceptions[cieKey] != null) {
    return cultureData.cityItemExceptions[cieKey];
  }
  if (cultureData.itemBonus && cultureData.itemBonus[normName] != null) {
    return cultureData.itemBonus[normName];
  }
  if (cultureData.regionBonus && cultureData.regionBonus[category] != null) {
    return cultureData.regionBonus[category];
  }
  return 0;
}
function getSeasonBonus(city, category) {
  const culture = getCulture(city);
  const cultureData = culture ? UWO_DATA.CULTURES[culture] : null;
  if (cultureData && cultureData.seasonBonus && cultureData.seasonBonus[category] != null) {
    return cultureData.seasonBonus[category];
  }
  return UWO_DATA.GLOBAL_SEASON_DEFAULT[category] != null ? UWO_DATA.GLOBAL_SEASON_DEFAULT[category] : 0;
}


// ── 원격 조회 전용 (읽기 키만 보유 — 이 페이지에는 쓰기 권한이 없음) ──
const REMOTE_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwXC2i8pNGJj1eEwCmUNWfxZ_JddCU_D51e-PRCOEgMs9QTlvbsHkQAAlHNwK3XbUBuug/exec";
const REMOTE_READ_KEY = "여기에-읽기전용-키"; // Apps Script의 READ_KEY와 동일하게

let items = [];
let boosts = [];
let searchTerm = "";
let filterSource = "";
let filterCategory = "";
let filterOrigin = "";

function setRemoteStatusUI(status) {
  const el = document.getElementById("remoteStatus");
  if (!el) return;
  const map = {
    loading: ["불러오는 중...", "var(--text-muted)"],
    ok: ["최신 데이터", "#7ec996"],
    error: ["불러오기 실패", "#e08a70"],
  };
  const [text, color] = map[status] || ["", ""];
  el.textContent = text;
  el.style.color = color;
}

async function loadFromRemote() {
  setRemoteStatusUI("loading");
  try {
    const url = REMOTE_WEBAPP_URL + "?key=" + encodeURIComponent(REMOTE_READ_KEY);
    const res = await fetch(url);
    const json = await res.json();
    if (!json.ok) { setRemoteStatusUI("error"); return false; }
    const data = json.data || {};
    items = data.items || [];
    boosts = data.boosts || [];
    setRemoteStatusUI("ok");
    return true;
  } catch (e) {
    setRemoteStatusUI("error");
    return false;
  }
}

function saleBonuses(sale, item) {
  const regionBonus = getRegionBonus(sale.city, item.category, item.name);
  const seasonBonus = getSeasonBonus(sale.city, item.category);
  const marketBonus = sale.marketBonus != null && sale.marketBonus !== "" ? sale.marketBonus : 100;
  return { regionBonus, seasonBonus, marketBonus };
}
function baseSalePrice(sale, item) {
  const b = saleBonuses(sale, item);
  return sale.price / (b.marketBonus / 100);
}
function itemIntrinsicValue(sale, item) {
  const b = saleBonuses(sale, item);
  const regionSeasonMultiplier = 1 + (b.regionBonus + b.seasonBonus) / 100;
  const marketMultiplier = b.marketBonus / 100;
  return sale.price / (regionSeasonMultiplier * marketMultiplier);
}
function bestSale(item) {
  if (!item.sales || item.sales.length === 0) return null;
  return item.sales.reduce((best, s) => (baseSalePrice(s, item) > baseSalePrice(best, item) ? s : best), item.sales[0]);
}

function render() {
  renderCategoryFilterOptions();
  renderList();
}

function renderCategoryFilterOptions() {
  const sel = document.getElementById("filterCategory");
  const prev = sel.value;
  const cats = Array.from(new Set(items.map(i => i.category))).sort();
  sel.innerHTML = "<option value=''>분류 전체</option>" + cats.map(c => "<option value='" + c + "'>" + c + "</option>").join("");
  sel.value = cats.includes(prev) ? prev : "";
  filterCategory = sel.value;

  const originSel = document.getElementById("filterOrigin");
  const prevOrigin = originSel.value;
  const origins = Array.from(new Set(items.map(i => i.origin))).sort();
  originSel.innerHTML = "<option value=''>획득처 전체</option>" + origins.map(o => "<option value='" + o + "'>" + o + "</option>").join("");
  originSel.value = origins.includes(prevOrigin) ? prevOrigin : "";
  filterOrigin = originSel.value;
}

function renderList() {
  const container = document.getElementById("itemList");
  container.innerHTML = "";

  const term = searchTerm.toLowerCase();
  const list = items.filter(it => {
    if (filterSource && it.source !== filterSource) return false;
    if (filterCategory && it.category !== filterCategory) return false;
    if (filterOrigin && it.origin !== filterOrigin) return false;
    if (term && !it.name.toLowerCase().includes(term)) return false;
    return true;
  });

  if (list.length === 0) {
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = items.length === 0 ? "등록된 교역품이 없습니다." : "조건에 맞는 교역품이 없습니다.";
    container.appendChild(hint);
    return;
  }
  list.forEach(item => container.appendChild(makeItemCard(item)));
}

let openItemId = null;

function makeItemCard(item) {
  const card = document.createElement("div");
  card.className = "item-card";

  const head = document.createElement("div");
  head.className = "item-head";

  const left = document.createElement("div");
  left.style.cssText = "display:flex; flex-direction:column; gap:4px;";
  const title = document.createElement("div");
  title.className = "item-title";
  title.textContent = item.name;
  const tags = document.createElement("div");
  tags.className = "item-tags";
  tags.innerHTML =
    "<span class='tag source-" + item.source + "'>" + item.source + "</span>" +
    "<span class='tag category'>" + item.category + "</span>" +
    "<span class='tag origin'>" + item.origin + "</span>";
  left.appendChild(title);
  left.appendChild(tags);

  const best = bestSale(item);
  const bestLabel = document.createElement("div");
  bestLabel.className = "item-best";
  bestLabel.textContent = best
    ? "최고 기준단가: " + best.city + " (" + Math.round(baseSalePrice(best, item)).toLocaleString() + ")"
    : "판매 기록 없음";

  head.appendChild(left);
  head.appendChild(bestLabel);
  head.onclick = () => { openItemId = (openItemId === item.id) ? null : item.id; renderList(); };

  const body = document.createElement("div");
  body.className = "item-body" + (openItemId === item.id ? " open" : "");

  const table = document.createElement("table");
  table.className = "sales-table";
  const bestId = best ? best.id : null;
  const sortedSales = (item.sales || []).slice().sort((a, b) => baseSalePrice(b, item) - baseSalePrice(a, item));
  table.innerHTML = "<tr><th>도시</th><th>지역</th><th>문화권</th><th>판매가</th><th>지역 우대%</th><th>시즌 우대%</th><th>시세%</th><th>기준단가</th><th>비고</th></tr>" +
    sortedSales.map(s => {
      const b = saleBonuses(s, item);
      const region = getRegion(s.city) || "-";
      const culture = getCulture(s.city) || "-";
      return "<tr class='" + (s.id === bestId ? "best-row" : "") + "'>" +
        "<td>" + s.city + "</td>" +
        "<td>" + region + "</td>" +
        "<td>" + culture + "</td>" +
        "<td class='num'>" + s.price.toLocaleString() + "</td>" +
        "<td class='num'>" + b.regionBonus + "%</td>" +
        "<td class='num'>" + b.seasonBonus + "%</td>" +
        "<td class='num'>" + b.marketBonus + "%</td>" +
        "<td class='num'>" + Math.round(baseSalePrice(s, item)).toLocaleString() + "</td>" +
        "<td>" + (s.note || "") + "</td>" +
        "</tr>";
    }).join("");
  if (!item.sales || item.sales.length === 0) {
    table.innerHTML += "<tr><td colspan='9' class='empty-hint'>기록된 판매처가 없습니다.</td></tr>";
  }
  const tableWrap = document.createElement("div");
  tableWrap.className = "sales-table-wrap";
  tableWrap.appendChild(table);
  body.appendChild(tableWrap);

  // 가격 계산기 (조회 전용 — 쓰기 없음)
  const calcId = "cityList-" + item.id;
  const calcBox = document.createElement("div");
  calcBox.className = "calc-box";
  calcBox.onclick = (e) => e.stopPropagation();
  calcBox.innerHTML =
    "<div><label>도시 (아무 도시나 가능)</label><input type='text' class='calc-city-input' list='" + calcId + "' style='width:130px;'></div>" +
    "<div><label>시세 %</label><input type='number' class='calc-market-input' style='width:70px;'></div>" +
    "<button class='calc-btn'>계산</button>" +
    "<span class='calc-result' style='font-size:12px; color:var(--text-muted);'></span>" +
    "<datalist id='" + calcId + "'></datalist>";
  body.appendChild(calcBox);

  calcBox.querySelector("#" + calcId).innerHTML = UWO_DATA.ALL_CITIES.map(c => "<option value='" + c + "'></option>").join("");

  calcBox.querySelector(".calc-btn").addEventListener("click", () => {
    const cityQuery = calcBox.querySelector(".calc-city-input").value.trim();
    const marketInputRaw = calcBox.querySelector(".calc-market-input").value;
    const marketInput = marketInputRaw !== "" ? Number(marketInputRaw) : 100;
    const resultSpan = calcBox.querySelector(".calc-result");
    if (!cityQuery) { resultSpan.textContent = "도시를 입력해주세요."; return; }
    const allSales = item.sales || [];
    if (allSales.length === 0) { resultSpan.textContent = "이 교역품에 기록된 판매가가 없습니다."; return; }
    const avgBase = allSales.reduce((sum, s) => sum + itemIntrinsicValue(s, item), 0) / allSales.length;
    const regionBonus = getRegionBonus(cityQuery, item.category, item.name);
    const seasonBonus = getSeasonBonus(cityQuery, item.category);
    const estimated = avgBase * (1 + (regionBonus + seasonBonus) / 100) * (marketInput / 100);
    const culture = getCulture(cityQuery);
    const region = getRegion(cityQuery);
    resultSpan.textContent = "예상가: " + Math.round(estimated).toLocaleString() +
      " (순수가치 " + Math.round(avgBase).toLocaleString() + " × 지역우대" + regionBonus + "%+시즌우대" + seasonBonus + "% × 시세" + marketInput + "%" +
      (culture ? ", 문화권:" + culture : "") + (region ? "/지역:" + region : "") + ")";
  });

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

document.getElementById("searchInput").addEventListener("input", (e) => { searchTerm = e.target.value; renderList(); });
document.getElementById("filterSource").addEventListener("change", (e) => { filterSource = e.target.value; renderList(); });
document.getElementById("filterCategory").addEventListener("change", (e) => { filterCategory = e.target.value; renderList(); });
document.getElementById("filterOrigin").addEventListener("change", (e) => { filterOrigin = e.target.value; renderList(); });
document.getElementById("refreshBtn").addEventListener("click", async () => { await loadFromRemote(); render(); });

(async function init() {
  await loadFromRemote();
  render();
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대항해시대 오리진 - 지도</title>
<style>
  :root {
    --bg: #16181c;
    --card: #1e2126;
    --border: #2d3138;
    --border-strong: #3d434c;
    --text: #e8e6e1;
    --text-muted: #8b929c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--text-muted); margin: 0 0 16px; }
  a { color: var(--text-muted); }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 14px; padding: 10px 12px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .toolbar input[type="text"] {
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px;
    color: var(--text); padding: 6px 10px; font-size: 13px; width: 200px;
  }
  .toolbar label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .toolbar select {
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px;
    color: var(--text); padding: 5px 8px; font-size: 12px;
  }
  #zoomLabel { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  #mapViewport {
    position: relative; width: 100%; height: calc(100vh - 140px); min-height: 400px;
    overflow: hidden; border: 1px solid var(--border-strong); border-radius: 8px;
    background: #2e3b3a; cursor: grab;
  }
  #mapViewport.dragging { cursor: grabbing; }
  #mapInner {
    position: absolute; top: 0; left: 0; transform-origin: 0 0;
  }
  #mapImage { display: block; user-select: none; -webkit-user-drag: none; }

  .marker {
    position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; cursor: pointer;
    border: 1.5px solid rgba(0,0,0,0.5);
  }
  .marker.town { background: #f2b84b; }
  .marker.village { background: #7ec996; }
  .marker.highlight { outline: 2px solid #fff; outline-offset: 1px; z-index: 5; }
  .marker:hover { filter: brightness(1.3); }

  .marker-label {
    position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #fff; background: rgba(0,0,0,0.55); padding: 1px 4px;
    border-radius: 3px; white-space: nowrap; pointer-events: none;
  }

  /* 정보 팝업 (진짜 모달) */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 1000; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px;
    max-width: 420px; width: 100%; padding: 20px 22px;
  }
  .modal-box .row { display: flex; justify-content: space-between; align-items: center; }
  .modal-close-btn { font-size: 20px; line-height: 1; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 8px; }
  .modal-close-btn:hover { color: var(--text); }
  .info-table { width: 100%; margin-top: 10px; font-size: 13px; border-collapse: collapse; }
  .info-table td { padding: 5px 0; border-bottom: 1px solid var(--border); }
  .info-table td:first-child { color: var(--text-muted); width: 90px; }
  .kind-badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px;
  }
  .kind-badge.town { background: #6b4f1d; color: #f2b84b; }
  .kind-badge.village { background: #2f5240; color: #7ec996; }
</style>
</head>
<body>

<h1>대항해시대 오리진 - 지도</h1>
<p class="sub">
  주황색: 도시(224개) · 초록색: 물물교환 마을(68개) — 마커를 클릭하면 상세 정보를 볼 수 있습니다.
  <a href="/mw.html">← 교역품 도구로</a>
</p>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="도시/마을 이름 검색 후 Enter">
  <label><input type="checkbox" id="showTowns" checked> 도시</label>
  <label><input type="checkbox" id="showVillages" checked> 마을</label>
  <label><input type="checkbox" id="showLabels"> 이름 항상 표시</label>
  <button id="resetViewBtn">보기 초기화</button>
  <span id="zoomLabel">100%</span>
</div>

<div id="mapViewport">
  <div id="mapInner">
    <img id="mapImage" src="/data/mapview/world_map.jpg" alt="세계지도">
  </div>
</div>

<div class="modal-overlay" id="infoModal">
  <div class="modal-box">
    <div class="row">
      <h2 style="margin:0; font-size:17px;" id="infoName">-</h2>
      <button class="modal-close-btn" id="closeInfoBtn">&times;</button>
    </div>
    <table class="info-table" id="infoTable"></table>
  </div>
</div>

<script src="/data/mapview/map_data.js"></script>
<script>
// ── 좌표 변환 ──
// 게임 내부 좌표(step4, 캔버스 10000x5881 기준) -> 이 페이지의 지도 이미지(world_map.jpg, step3 축소본) 픽셀.
// 검증 근거: landmask.png(7021x4144, SCALE=0.7021로 게임좌표와 이미 검증된 관계)를 매개로,
// world_map.jpg가 그 landmask와 동일 비율의 다른 해상도 렌더링이라는 점을 8개 도시(안코나,
// 베네치아,이스탄불,리우데자네이루,다바오,북경,케이프타운,리스본) 픽셀 대조로 확인함.
const GAME_TO_MASK_SCALE = 0.7021;   // landmask.png 폭(7021) / 게임좌표 기준(10000)
const MASK_W = 7021, MASK_H = 4144;  // landmask.png 크기
const MAP_IMG_W = 2414, MAP_IMG_H = 1419; // world_map.jpg 실제 크기
const RATIO_X = MAP_IMG_W / MASK_W;
const RATIO_Y = MAP_IMG_H / MASK_H;

function gameToMapPixel(gx, gy) {
  const maskPx = gx * GAME_TO_MASK_SCALE;
  const maskPy = gy * GAME_TO_MASK_SCALE;
  return { x: maskPx * RATIO_X, y: maskPy * RATIO_Y };
}

// ── 마커 데이터 준비 ──
const allMarkers = [];
Object.keys(MAP_CITY_COORDS.towns).forEach(name => {
  const c = MAP_CITY_COORDS.towns[name];
  const p = gameToMapPixel(c.x, c.y);
  allMarkers.push({ name, kind: "town", px: p.x, py: p.y });
});
Object.keys(MAP_CITY_COORDS.villages).forEach(name => {
  const c = MAP_CITY_COORDS.villages[name];
  const p = gameToMapPixel(c.x, c.y);
  allMarkers.push({ name, kind: "village", px: p.x, py: p.y });
});

// ── 렌더링 ──
const mapInner = document.getElementById("mapInner");
const mapImage = document.getElementById("mapImage");
const viewport = document.getElementById("mapViewport");
let markerEls = [];

function renderMarkers() {
  markerEls.forEach(el => el.remove());
  markerEls = [];
  const showTowns = document.getElementById("showTowns").checked;
  const showVillages = document.getElementById("showVillages").checked;
  const showLabels = document.getElementById("showLabels").checked;

  allMarkers.forEach(m => {
    if (m.kind === "town" && !showTowns) return;
    if (m.kind === "village" && !showVillages) return;
    const el = document.createElement("div");
    el.className = "marker " + m.kind;
    el.style.left = m.px + "px";
    el.style.top = m.py + "px";
    el.title = m.name;
    el.dataset.name = m.name;
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      showInfo(m);
    });
    mapInner.appendChild(el);
    markerEls.push(el);

    if (showLabels) {
      const label = document.createElement("div");
      label.className = "marker-label";
      label.style.left = m.px + "px";
      label.style.top = (m.py + 6) + "px";
      label.textContent = m.name;
      mapInner.appendChild(label);
      markerEls.push(label);
    }
  });
}

// ── 팬/줌 상태 ──
let scale = 1, minScale = 1;
let originX = 0, originY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0, originStartX = 0, originStartY = 0;

function applyTransform() {
  mapInner.style.transform = "translate(" + originX + "px," + originY + "px) scale(" + scale + ")";
  document.getElementById("zoomLabel").textContent = Math.round(scale * 100) + "%";
}

function fitToViewport() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  minScale = Math.min(vw / MAP_IMG_W, vh / MAP_IMG_H);
  scale = minScale;
  originX = (vw - MAP_IMG_W * scale) / 2;
  originY = (vh - MAP_IMG_H * scale) / 2;
  applyTransform();
}

function initMap() {
  fitToViewport();
  renderMarkers();
}
if (mapImage.complete && mapImage.naturalWidth > 0) {
  initMap();
} else {
  mapImage.addEventListener("load", initMap);
}
window.addEventListener("resize", fitToViewport);

// Pointer Capture 사용: 드래그 중 마우스가 브라우저 창 밖으로 나가서 버튼을 놔도
// pointerup을 확실히 받기 위함. (기존 mousedown/mousemove/mouseup 방식은 창 밖에서
// 버튼을 놓으면 mouseup을 못 받아 isDragging이 계속 true로 남는 버그가 있었음 —
// 그 뒤로는 버튼 없이 마우스만 움직여도 지도가 계속 따라오는 것처럼 보임.)
function endDrag(e) {
  if (!isDragging) return;
  isDragging = false;
  viewport.classList.remove("dragging");
  if (e && viewport.hasPointerCapture && viewport.hasPointerCapture(e.pointerId)) {
    viewport.releasePointerCapture(e.pointerId);
  }
}
viewport.addEventListener("pointerdown", (e) => {
  if (e.button !== undefined && e.button !== 0) return;
  isDragging = true;
  viewport.classList.add("dragging");
  viewport.setPointerCapture(e.pointerId);
  dragStartX = e.clientX; dragStartY = e.clientY;
  originStartX = originX; originStartY = originY;
});
viewport.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  originX = originStartX + (e.clientX - dragStartX);
  originY = originStartY + (e.clientY - dragStartY);
  applyTransform();
});
viewport.addEventListener("pointerup", endDrag);
viewport.addEventListener("pointercancel", endDrag);
window.addEventListener("blur", () => endDrag());

viewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
  const worldX = (mouseX - originX) / scale, worldY = (mouseY - originY) / scale;
  const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
  const newScale = Math.min(Math.max(scale * factor, minScale), minScale * 12);
  originX = mouseX - worldX * newScale;
  originY = mouseY - worldY * newScale;
  scale = newScale;
  applyTransform();
}, { passive: false });

document.getElementById("resetViewBtn").addEventListener("click", fitToViewport);
document.getElementById("showTowns").addEventListener("change", renderMarkers);
document.getElementById("showVillages").addEventListener("change", renderMarkers);
document.getElementById("showLabels").addEventListener("change", renderMarkers);

// ── 검색 ──
document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim();
  if (!q) return;
  const found = allMarkers.find(m => m.name === q) || allMarkers.find(m => m.name.includes(q));
  if (!found) { alert("'" + q + "'를 찾을 수 없습니다."); return; }
  markerEls.forEach(el => el.classList.remove("highlight"));
  const targetEl = markerEls.find(el => el.dataset && el.dataset.name === found.name);
  if (targetEl) targetEl.classList.add("highlight");

  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  if (scale < minScale * 3) scale = minScale * 3;
  originX = vw / 2 - found.px * scale;
  originY = vh / 2 - found.py * scale;
  applyTransform();
  showInfo(found);
});

// ── 정보 팝업 ──
function showInfo(m) {
  document.getElementById("infoName").innerHTML =
    m.name + "<span class='kind-badge " + m.kind + "'>" + (m.kind === "town" ? "도시" : "마을") + "</span>";
  const table = document.getElementById("infoTable");
  const rows = [];
  if (m.kind === "town") {
    const region = MAP_CITY_TO_REGION[m.name] || "-";
    const culture = MAP_CITY_TO_CULTURE[m.name] || "-";
    rows.push(["지역", region]);
    rows.push(["문화권", culture]);
  } else {
    const region = MAP_VILLAGE_REGION[m.name] || "-";
    rows.push(["지역", region]);
  }
  table.innerHTML = rows.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("");
  document.getElementById("infoModal").classList.add("open");
}
document.getElementById("closeInfoBtn").addEventListener("click", () => {
  document.getElementById("infoModal").classList.remove("open");
});
document.getElementById("infoModal").addEventListener("click", (e) => {
  if (e.target.id === "infoModal") document.getElementById("infoModal").classList.remove("open");
});
</script>
</body>
</html>
